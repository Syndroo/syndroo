name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    if: github.repository == 'Syndroo/syndroo'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types and generated bindings
        run: npm run check

      - name: Bundle Worker
        run: npm run bundle

      - name: Check Worker startup
        run: npm run startup

      # Read-only gate. It validates the three-package train, the release event,
      # and the dist-tag the version implies, and reports which packages are
      # still missing. It publishes nothing.
      - name: Validate release train
        id: train
        run: npm run release:train
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Run installed-package consumer gate
        run: npm run e2e:consumer -- --source tarball

      - name: Report which packages the train still needs
        run: |
          echo "Release train ${{ steps.train.outputs.version }} (${{ steps.train.outputs.dist_tag }}):"
          echo "  sdk    ${{ steps.train.outputs.sdk_status }}"
          echo "  cli    ${{ steps.train.outputs.cli_status }}"
          echo "  worker ${{ steps.train.outputs.worker_status }}"

      - name: Validate release metadata
        id: package
        run: npm run release:check
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Inspect package contents
        run: npm pack --workspace @syndroo/cloudflare-worker --dry-run

      - name: Verify package artifact
        run: npm run verify:package

      - name: Run Mock SNS end-to-end suite
        run: npm run test:e2e

      - name: Publish package
        if: github.event_name == 'release' && steps.package.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
        run: |
          case "$DIST_TAG" in
            next)
              npm publish --workspace @syndroo/cloudflare-worker --tag next
              ;;
            latest)
              npm publish --workspace @syndroo/cloudflare-worker
              ;;
            *)
              echo "Unexpected dist-tag '$DIST_TAG'; refusing to publish." >&2
              exit 1
              ;;
          esac

      - name: Report existing package
        if: github.event_name == 'release' && steps.package.outputs.published == 'true'
        run: echo "@syndroo/cloudflare-worker@${{ steps.package.outputs.version }} already exists; skipping publish."

      - name: Report validation-only run
        if: github.event_name != 'release'
        run: echo "This event validates the release candidate only; publishing requires a release event."
