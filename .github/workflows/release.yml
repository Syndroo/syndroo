name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    if: github.repository == 'Syndroo/syndroo'
    runs-on: ubuntu-latest
    env:
      # The 0.6 candidate publishes @syndroo/cli only. The SDK and the Worker
      # stay at their existing versions and are validated, never published, by
      # this workflow.
      SYNDROO_RELEASE_SET: cli

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types and generated bindings
        run: npm run check

      - name: Bundle Worker
        run: npm run bundle

      - name: Check Worker startup
        run: npm run startup

      # Read-only gate. It validates the three-package train, the release event,
      # and the dist-tag the version implies, and reports which packages are
      # still missing. It publishes nothing.
      - name: Validate release train
        id: train
        run: npm run release:train
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Pack the CLI candidate
        run: npm run pack:cli

      - name: Install and exercise the CLI candidate in isolation
        run: npm run e2e:cli-local

      - name: Run installed-package consumer gate
        run: npm run e2e:consumer -- --source tarball

      - name: Report which packages the train still needs
        run: |
          echo "Release set ${{ steps.train.outputs.release_set }} at ${{ steps.train.outputs.version }} (${{ steps.train.outputs.dist_tag }}):"
          echo "  cli    ${{ steps.train.outputs.cli_status }}"
          echo "  @syndroo/sdk and @syndroo/cloudflare-worker are out of this release set."

      - name: Validate release metadata
        id: package
        run: npm run release:check
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Report the release target
        run: |
          echo "metadata target ${{ steps.package.outputs.package }} ${{ steps.package.outputs.version }} (${{ steps.package.outputs.dist_tag }})"
          test "${{ steps.package.outputs.package }}" = "@syndroo/cli"
          test "${{ steps.package.outputs.version }}" = "${{ steps.train.outputs.version }}"
          test "${{ steps.package.outputs.dist_tag }}" = "${{ steps.train.outputs.dist_tag }}"

      - name: Inspect package contents
        run: npm pack --workspace @syndroo/cloudflare-worker --dry-run

      - name: Inspect the CLI candidate contents
        run: npm pack --workspace @syndroo/cli --dry-run

      - name: Verify package artifact
        run: npm run verify:package

      - name: Run Mock SNS end-to-end suite
        run: npm run test:e2e

      - name: Publish package
        if: >-
          github.event_name == 'release' &&
          steps.train.outputs.release_set == 'cli' &&
          steps.train.outputs.publish_cli == 'true' &&
          steps.package.outputs.package == '@syndroo/cli' &&
          steps.package.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$PACKAGE_VERSION" != "${{ steps.train.outputs.version }}" ]; then
            echo "Metadata version '$PACKAGE_VERSION' does not match the train version '${{ steps.train.outputs.version }}'; refusing to publish." >&2
            exit 1
          fi

          case "$DIST_TAG" in
            next)
              npm publish --workspace @syndroo/cli --tag next
              ;;
            latest)
              echo "A CLI release candidate must publish under 'next'; refusing 'latest'." >&2
              exit 1
              ;;
            *)
              echo "Unexpected dist-tag '$DIST_TAG'; refusing to publish." >&2
              exit 1
              ;;
          esac

      - name: Report existing package
        if: github.event_name == 'release' && steps.package.outputs.published == 'true'
        run: echo "${{ steps.package.outputs.package }}@${{ steps.package.outputs.version }} already exists; skipping publish."

      - name: Report validation-only run
        if: github.event_name != 'release'
        run: echo "This event validates the release candidate only; publishing requires a release event."
