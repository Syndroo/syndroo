name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      mode:
        description: "validate only, or publish the train when every gate passes"
        type: choice
        options:
          - validate
          - publish
        default: validate

permissions:
  contents: read
  id-token: write

# A separate, constant group from `auto-release` so release-please never blocks
# the publish train and vice versa, while both `release: published` and a manual
# `workflow_dispatch` share one queue. cancel-in-progress is false: a *running*
# publish is never cancelled, so a `publish` dispatch cannot interrupt a
# release-triggered run midway through the ten-package train.
#
# This is narrower than "nothing is cancelled": GitHub only guarantees the
# running job survives. An older *pending* run in the same group can be replaced
# by a newer queued run, so a release-triggered publication can be dropped while
# it waits. Nothing retries that automatically. Recovery is re-running this
# workflow (Re-run jobs on the dropped run, or `workflow_dispatch` with
# `mode: publish`); the train publishes only packages still missing, so the
# rerun resumes instead of conflicting on duplicates.
concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Syndroo/syndroo'
    runs-on: ubuntu-latest
    # Publishing a GitHub Release automatically publishes the validated npm
    # train. Manual dispatch retains explicit validate/publish modes.

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      # Build first: the type gate resolves sibling workspaces through their
      # built declarations, so a fresh checkout has nothing to check yet.
      - name: Build every package
        run: npm run build

      - name: Check types, generated bindings, packages and bundles
        run: npm run check

      - name: Run package tests
        run: npm test

      - name: Run release-tooling tests
        run: npm run test:scripts

      # Read-only gate. It validates the ten-package train, the release event and
      # the dist-tag the version implies, and reports what is still missing. It
      # publishes nothing.
      - name: Validate release train
        id: train
        run: npm run release:train
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Validate release metadata
        id: package
        run: npm run release:check
        env:
          SYNDROO_CHECK_REGISTRY: "true"
          SYNDROO_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          SYNDROO_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Report the train
        run: |
          echo "release set ${{ steps.train.outputs.release_set }} at ${{ steps.train.outputs.version }} (${{ steps.train.outputs.dist_tag }}):"
          echo "  provider-sdk      ${{ steps.train.outputs['provider-sdk_status'] }}"
          echo "  provider-bluesky  ${{ steps.train.outputs['provider-bluesky_status'] }}"
          echo "  provider-threads  ${{ steps.train.outputs['provider-threads_status'] }}"
          echo "  provider-linkedin ${{ steps.train.outputs['provider-linkedin_status'] }}"
          echo "  provider-mastodon ${{ steps.train.outputs['provider-mastodon_status'] }}"
          echo "  provider-devto    ${{ steps.train.outputs['provider-devto_status'] }}"
          echo "  sdk               ${{ steps.train.outputs.sdk_status }}"
          echo "  cli               ${{ steps.train.outputs.cli_status }}"
          echo "  server            ${{ steps.train.outputs.server_status }}"
          echo "  cloudflare        ${{ steps.train.outputs.cloudflare_status }}"
          echo "metadata target ${{ steps.package.outputs.package }} ${{ steps.package.outputs.version }} (${{ steps.package.outputs.dist_tag }})"

      - name: Inspect package contents
        run: |
          npm pack --workspace @syndroo/provider-sdk --dry-run
          npm pack --workspace @syndroo/sdk --dry-run
          npm pack --workspace @syndroo/cli --dry-run
          npm pack --workspace @syndroo/server --dry-run
          npm pack --workspace @syndroo/cloudflare --dry-run

      # Publish in train order: the provider contract, then the official
      # providers, then the HTTP SDK, the CLI, the server and the Worker. Each
      # package is published only when the train reports it as still missing, so
      # a partially completed train resumes instead of failing on duplicates.
      - name: Publish the train
        id: publish
        if: >-
          ${{ github.event_name == 'release' ||
              (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') }}
        env:
          DIST_TAG: ${{ steps.train.outputs.dist_tag }}
          TRAIN_VERSION: ${{ steps.train.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$TRAIN_VERSION" != "${{ steps.package.outputs.version }}" ]; then
            echo "Metadata version '${{ steps.package.outputs.version }}' does not match the train version '$TRAIN_VERSION'; refusing to publish." >&2
            exit 1
          fi

          case "$DIST_TAG" in
            next|latest) ;;
            *)
              echo "Unexpected dist-tag '$DIST_TAG'; refusing to publish." >&2
              exit 1
              ;;
          esac

          publish() {
            slug="$1"
            name="$2"
            if [ "${{ steps.train.outputs.publish_required }}" != "true" ]; then
              echo "train reports nothing to publish; skipping $name"
              return 0
            fi
            if [ "${PUBLISH_STATUS[$slug]:-false}" != "true" ]; then
              echo "$name already satisfies ${{ steps.train.outputs.version }}; skipping"
              return 0
            fi
            echo "publishing $name under $DIST_TAG"
            npm publish --workspace "$name" --tag "$DIST_TAG"
          }

          declare -A PUBLISH_STATUS=(
            ["provider-sdk"]="${{ steps.train.outputs['publish_provider-sdk'] }}"
            ["provider-bluesky"]="${{ steps.train.outputs['publish_provider-bluesky'] }}"
            ["provider-threads"]="${{ steps.train.outputs['publish_provider-threads'] }}"
            ["provider-linkedin"]="${{ steps.train.outputs['publish_provider-linkedin'] }}"
            ["provider-mastodon"]="${{ steps.train.outputs['publish_provider-mastodon'] }}"
            ["provider-devto"]="${{ steps.train.outputs['publish_provider-devto'] }}"
            [sdk]="${{ steps.train.outputs.publish_sdk }}"
            [cli]="${{ steps.train.outputs.publish_cli }}"
            [server]="${{ steps.train.outputs.publish_server }}"
            [cloudflare]="${{ steps.train.outputs.publish_cloudflare }}"
          )

          publish provider-sdk      @syndroo/provider-sdk
          publish provider-bluesky  @syndroo/provider-bluesky
          publish provider-threads  @syndroo/provider-threads
          publish provider-linkedin @syndroo/provider-linkedin
          publish provider-mastodon @syndroo/provider-mastodon
          publish provider-devto    @syndroo/provider-devto
          publish sdk               @syndroo/sdk
          publish cli               @syndroo/cli
          publish server            @syndroo/server
          publish cloudflare        @syndroo/cloudflare

      # Optional cross-repository notification, deliberately downstream of the
      # publish outcome. It runs only when the website sync is explicitly
      # enabled (the exact string `true`), the publish step succeeded (including
      # an idempotent rerun that found every package already present), and the
      # train is stable (`latest`). Validate-only runs, failed publishes and
      # prereleases (`next`) never dispatch.
      #
      # The fine-grained token is scoped to Syndroo/syndroo-web Contents write
      # and is exposed to this step alone. A missing token fails this step
      # clearly, but only after an enabled run; npm publication has already
      # finished and is not rolled back by a notification failure.
      - name: Notify the website of the stable release
        if: >-
          ${{ vars.SYNDROO_SYNC_WEBSITE == 'true' &&
              steps.publish.outcome == 'success' &&
              steps.train.outputs.dist_tag == 'latest' }}
        env:
          SYNDROO_RELEASE_VERSION: ${{ steps.train.outputs.version }}
          SYNDROO_WEB_DISPATCH_TOKEN: ${{ secrets.SYNDROO_WEB_DISPATCH_TOKEN }}
        run: node scripts/notify-website-release.ts

      - name: Report validation-only run
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate' }}
        run: echo "Manual validation completed; publish a GitHub Release or dispatch mode=publish to publish."
