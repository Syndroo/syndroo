name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        # engines.node is >=24.19.0; the architecture-v1 packages are not
        # tested on older lines.
        node-version:
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        run: npm run dco:check
        env:
          SYNDROO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYNDROO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Generated protocol bindings, the provider catalog and the package graph
      # are checked for drift before any build, so a stale generator fails here
      # rather than silently shipping.
      - name: Check types, generated bindings and package graph
        run: npm run check

      - name: Build every package
        run: npm run build

      # The bundle gate only asserts inlining once an artifact exists, so it runs
      # again after the build; before the build those rows honestly report
      # PENDING instead of passing on faith.
      - name: Verify bundled artifacts
        run: node scripts/check-v1.ts

      - name: Run package tests
        run: npm test

      - name: Run release-tooling tests
        run: npm run test:scripts

      - name: Check e2e types and run the local-only suite
        run: |
          npm run check:e2e
          npm run e2e:local-only

      - name: Inspect publishable packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm pack --workspace @syndroo/provider-sdk --dry-run
          npm pack --workspace @syndroo/sdk --dry-run
          npm pack --workspace @syndroo/cli --dry-run
          npm pack --workspace @syndroo/server --dry-run
          npm pack --workspace @syndroo/cloudflare --dry-run

      - name: Verify no generated file is left uncommitted
        run: git diff --exit-code
