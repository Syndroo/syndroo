name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - "22"
          - "24"
    env:
      # The 0.6 candidate publishes the CLI alone. The Worker gates below still
      # run in full; only the publishable release set is narrowed.
      SYNDROO_RELEASE_SET: cli

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        run: npm run dco:check
        env:
          SYNDROO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYNDROO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Run tests
        run: npm test

      - name: Check types and generated bindings
        run: npm run check

      - name: Bundle Worker
        run: npm run bundle

      - name: Check Worker startup
        run: npm run startup

      - name: Verify package artifact
        if: matrix.node-version == '24' && matrix.os == 'ubuntu-latest'
        run: npm run verify:package

      - name: Run Mock SNS end-to-end suite
        run: npm run test:e2e

      # The self-contained CLI candidate: built, packed, then installed into a
      # throwaway directory outside the repository with a blank HOME.
      - name: Pack the CLI candidate
        run: npm run pack:cli

      - name: Install and exercise the CLI candidate in isolation
        run: npm run e2e:cli-local

      # Layer 2: pack the artifacts, install them outside the monorepo, and run
      # the real CLI against the local harness. It installs only local tarballs
      # and contacts no registry for the Syndroo packages.
      - name: Run installed-package consumer gate
        if: matrix.node-version == '24'
        run: npm run e2e:consumer -- --source tarball

      - name: Inspect publish package
        if: matrix.node-version == '24'
        run: npm pack --workspace @syndroo/cloudflare-worker --dry-run

      - name: Inspect the CLI candidate contents
        run: npm pack --workspace @syndroo/cli --dry-run

      - name: Verify generated files
        run: git diff --exit-code
