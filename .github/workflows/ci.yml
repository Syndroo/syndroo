name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        # engines.node is >=24.19.0; the architecture-v1 packages are not
        # tested on older lines.
        node-version:
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        run: npm run dco:check
        env:
          SYNDROO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYNDROO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # The build comes first: every workspace's `check` resolves its sibling
      # packages through their built declarations, so a checkout with no `dist`
      # yet fails the type gate for the wrong reason. `--allow-missing` exists
      # for the pre-build case; CI uses the strict gate once the artifacts are
      # real.
      - name: Build every package
        run: npm run build

      # Types, generated protocol bindings, the package graph and the bundle
      # rows are all checked against the artifacts the previous step produced.
      - name: Check types, generated bindings, packages and bundles
        run: npm run check

      - name: Run package tests
        run: npm test

      - name: Run release-tooling tests
        run: npm run test:scripts

      - name: Check e2e types and run the local-only suite
        run: |
          npm run check:e2e
          npm run e2e:local-only

      - name: Inspect publishable packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm pack --workspace @syndroo/provider-sdk --dry-run
          npm pack --workspace @syndroo/sdk --dry-run
          npm pack --workspace @syndroo/cli --dry-run
          npm pack --workspace @syndroo/server --dry-run
          npm pack --workspace @syndroo/cloudflare --dry-run

      - name: Verify no generated file is left uncommitted
        run: git diff --exit-code
